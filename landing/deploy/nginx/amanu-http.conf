# Temporary HTTP-only configuration used while Let's Encrypt validates a new
# amanu.me installation. Replace it with amanu.conf after the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name amanu.me www.amanu.me;

    root /var/www/amanu;
    index index.html;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
