# Static Amanu landing page on Reina. Files are deployed to /var/www/amanu.

server {
    listen 80;
    listen [::]:80;
    server_name amanu.me www.amanu.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://amanu.me$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.amanu.me;

    ssl_certificate /etc/letsencrypt/live/amanu.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amanu.me/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    return 301 https://amanu.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amanu.me;

    ssl_certificate /etc/letsencrypt/live/amanu.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amanu.me/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    root /var/www/amanu;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Same first-party GoatCounter instance as zapuskzavtra.com and ctodaily.org.
    location = /m {
        proxy_pass http://127.0.0.1:8081/goatcounter/count$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Rate-Limit-Limit;
        proxy_hide_header X-Rate-Limit-Remaining;
        proxy_hide_header X-Rate-Limit-Reset;
    }

    location /goatcounter {
        auth_basic "closed";
        auth_basic_user_file /etc/nginx/goatcounter.htpasswd;

        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Strict-Transport-Security;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json application/xml image/svg+xml;
}
