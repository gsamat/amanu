name: Windows packaging metadata
on:
  workflow_dispatch:
  push:
    paths:
      - windows/scripts/Set-ReleaseInstallerName.ps1
      - windows/tests/Test-ReleaseInstallerName.ps1
      - .github/workflows/windows-package-metadata.yml
permissions:
  contents: read
jobs:
  package-metadata:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Verify versioned installer metadata and signature byte preservation
        shell: pwsh
        run: '& windows/tests/Test-ReleaseInstallerName.ps1'
