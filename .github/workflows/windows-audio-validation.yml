name: Windows audio validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-audio-validation.yml'

permissions:
  contents: read

jobs:
  audio:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build Windows app
        run: dotnet build windows/src/Amanu.App --configuration Release
      - name: Core tests
        run: dotnet test windows/tests/Amanu.Core.Tests --configuration Release
      - name: Audio lifecycle tests
        run: dotnet test windows/tests/Amanu.Audio.Tests --configuration Release
      - name: Windows UI tests
        run: dotnet test windows/tests/Amanu.Live.Tests --configuration Release
