name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Swift tests
        run: swift test
      - name: Landing checks
        run: python3 landing/tests/check.py
      - name: Release-script tests
        run: python3 -m unittest discover -s Tests/scripts -p 'test_*.py'
